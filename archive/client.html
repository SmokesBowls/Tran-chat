<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TranChat</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; background: #111; color: white; }
    #chat { height: 80vh; overflow-y: auto; padding: 10px; }
    #input-area { position: fixed; bottom: 0; width: 100%; display: flex; }
    #msg { flex-grow: 1; font-size: 1.2em; padding: 10px; }
    #send { padding: 10px 20px; font-size: 1em; background: #444; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <h2 style="text-align:center;">TranChat Live Room</h2>
  <div id="chat"></div>
  <div id="input-area">
    <input type="text" id="msg" placeholder="Type your message..." />
    <button id="send">Send</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
